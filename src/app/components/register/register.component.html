<div class="register-page">
  <section class="register-container">
    <h1>Registrarse</h1>

    <div class="elegir-opciones-container">
      <button
        type="button"
        class="btn opciones"
        (click)="elegirOpcion('especialista')"
      >
        <img src="public/medico.png" alt="Especialista" />
      </button>
      <button
        type="button"
        class="btn opciones"
        (click)="elegirOpcion('paciente')"
      >
        <img src="public/paciente.png" alt="Paciente" />
      </button>
    </div>

    <form
      *ngIf="formOpcion === 'especialista'"
      [formGroup]="especialistaForm"
      (ngSubmit)="register()"
    >
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" formControlName="nombre" required />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" formControlName="apellido" required />
      </div>

      <div class="form-group">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" formControlName="edad" required />
      </div>

      <div class="form-group">
        <label for="dni">DNI:</label>
        <input type="number" id="dni" formControlName="dni" required />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" formControlName="mail" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          required
        />
      </div>

      <div class="form-group">
        <h3>Selecciona tus especialidades</h3>
        <div *ngFor="let especialidad of availableEspecialidades">
          <label>
            <input
              class="inputcheckbox"
              type="checkbox"
              [checked]="formData.especialidades.includes(especialidad)"
              (change)="toggleEspecialidad(especialidad)"
            />
            {{ especialidad }}
          </label>
        </div>

        <div formArrayName="customEspecialidades">
          <div
            *ngFor="
              let especialidad of customEspecialidades.controls;
              let i = index
            "
          >
            <input
              type="text"
              [formControlName]="i"
              placeholder="Escriba una especialidad"
            />
          </div>
          <button type="button" (click)="addEspecialidadField()">
            Agregar otra especialidad
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="imagen1">Imagen de perfil:</label>
        <input
          type="file"
          id="imagen1"
          (change)="onFileSelected($event, 1)"
          accept="image/*"
          required
        />
      </div>

      <re-captcha
        (resolved)="onCaptchaResolved($event)"
        [siteKey]="'6LeJpIUqAAAAAONyGxGvRoy5XnpLNK9Qx7VXjEAK'"
      ></re-captcha>

      <button
        type="submit"
        class="btn acceso-rapido"
        [disabled]="isLoading || !especialistaForm.valid"
      >
        {{ isLoading ? "Registrando..." : "Registrarse" }}
      </button>
    </form>

    <!-- Formulario para Paciente -->
    <form
      *ngIf="formOpcion === 'paciente'"
      [formGroup]="pacienteForm"
      (ngSubmit)="register()"
    >
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" formControlName="nombre" required />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" formControlName="apellido" required />
      </div>

      <div class="form-group">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" formControlName="edad" required />
      </div>

      <div class="form-group">
        <label for="dni">DNI:</label>
        <input type="number" id="dni" formControlName="dni" required />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" formControlName="mail" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          required
        />
      </div>

      <div class="form-group">
        <label for="obraSocial">Obra Social:</label>
        <input
          type="text"
          id="obraSocial"
          formControlName="obraSocial"
          required
        />
      </div>

      <div class="form-group">
        <label for="imagen1">Imagen de perfil 1:</label>
        <input
          type="file"
          id="imagen1"
          (change)="onFileSelected($event, 1)"
          accept="image/*"
          required
        />
      </div>

      <div class="form-group">
        <label for="imagen2">Imagen de perfil 2:</label>
        <input
          type="file"
          id="imagen2"
          (change)="onFileSelected($event, 2)"
          accept="image/*"
          required
        />
      </div>

      <re-captcha
        (resolved)="onCaptchaResolved($event)"
        [siteKey]="'6LeJpIUqAAAAAONyGxGvRoy5XnpLNK9Qx7VXjEAK'"
      ></re-captcha>

      <button
        type="submit"
        class="btn acceso-rapido"
        [disabled]="isLoading || !pacienteForm.valid"
      >
        {{ isLoading ? "Registrando..." : "Registrarse" }}
      </button>
    </form>

    <button
      *ngIf="formOpcion"
      type="button"
      (click)="navigateToLogin()"
      class="btn acceso-rapido"
    >
      ¿Ya tienes una cuenta? Inicia sesión
    </button>

    <p *ngIf="!formOpcion" class="info-message">
      Elija una opción para registrarse.
    </p>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </section>
</div>
