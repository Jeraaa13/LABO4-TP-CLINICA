<div class="turnos-container">
  <div class="filtros-container">
    <div class="filtros-input">
      <input
        type="text"
        placeholder="Buscar en todos los campos"
        (input)="aplicarFiltros()"
        [(ngModel)]="filtroGeneral"
      />
      <span class="filtros-input-icon">🔍</span>
      <button
        *ngIf="filtroGeneral"
        (click)="limpiarFiltros()"
        class="btn-limpiar-filtro"
      >
        ✖
      </button>
    </div>

    <div class="filtros-info" *ngIf="filtroGeneral">
      <p>Resultados filtrados por: "{{ filtroGeneral }}"</p>
    </div>
  </div>

  <ng-container *ngIf="turnosFiltrados.length > 0; else sinTurnos">
    <app-card-turno
      *ngFor="let turno of turnosFiltrados"
      [turno]="turno"
      [tipo]="'paciente'"
    ></app-card-turno>
  </ng-container>

  <ng-template #sinTurnos>
    <div class="sin-turnos">
      <p>No se encontraron turnos que coincidan con la búsqueda</p>
    </div>
  </ng-template>
</div>
