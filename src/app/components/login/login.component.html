<section class="fourth-color login-section">
  <h1>Iniciar Sesión</h1>

  <form (ngSubmit)="login()" class="nice-form-group">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
        required
        class="form-control"
      />
    </div>

    <button type="submit" class="btn second-color" [disabled]="isLoading">
      {{ isLoading ? "Iniciando sesión..." : "Iniciar sesión" }}
    </button>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button
      type="button"
      class="btn second-color"
      (click)="navigateToRegister()"
      [disabled]="isLoading"
    >
      Registrarse
    </button>

    <div class="rapid-buttons">
      <button
        class="btn quick-login"
        type="button"
        (click)="loginRapido('paciente@test.com', '123123')"
        [disabled]="isLoading"
      >
        Acceso Paciente
      </button>
      <button
        class="btn quick-login"
        type="button"
        (click)="loginRapido('especialista@test.com', '123123')"
        [disabled]="isLoading"
      >
        Acceso Especialista
      </button>
      <button
        class="btn quick-login"
        type="button"
        (click)="loginRapido('admin@admin.com', '123123')"
        [disabled]="isLoading"
      >
        Admin
      </button>
    </div>
  </form>
</section>
